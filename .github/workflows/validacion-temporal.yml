name: Validación temporal

# TEMPORAL. Existe solo para comprobar de una vez que la cadena completa
# funciona: runner -> secreto DATABASE_URL -> Neon -> ingesta.
#
# Se dispara con el propio push que lo añade, así que no hace falta pulsar nada
# en la interfaz. Una vez comprobado, este fichero se borra.
on:
  push:
    branches: [main]

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_DRIVER: postgres
      USER_AGENT: WorldTune/0.1 (+https://github.com/${{ github.repository }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ¿Está configurado el secreto?
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Secreto presente (${#DATABASE_URL} caracteres). No se imprime su contenido."

      - run: npm ci

      - name: Geografía
        run: npm run ingest -- sync:geo

      # Solo México y 500 emisoras: se trata de probar la cadena, no de llenar
      # la base. El barrido mundial lo hará el cron diario.
      - name: Radio (muestra de México)
        run: npm run ingest -- sync:radio --country MX --limit 500

      - name: Televisión
        run: npm run ingest -- sync:tv

      - name: Contadores
        run: npm run ingest -- recount
